name: Release Assets

# Speed notes (v1.16.0 wall clock was ~21 min when runners were free, ~40 min when
# macos-latest queued). The long pole is `cargo build --release` with fat LTO +
# codegen-units=1 (~16 min on Windows / macOS Intel), then ~2 min uploading a
# multi-GB `target/` cache that the next tag almost never hits.
#
# This workflow keeps the same five archives, checksums, SBOM, cosign, and
# Homebrew write-back. It only changes *how* they are built:
#   - thin LTO + 8 codegen-units (CI env only; Cargo.toml fat LTO is unchanged)
#   - cache cargo registry/git, never `target/`
#   - vcpkg OpenSSL on Windows instead of chocolatey
#   - lld on Linux
#   - x86_64 macOS is cross-compiled on macos-latest (ARM), avoiding macos-15-intel
#   - macOS installs openssl@3 via brew; the Intel target also builds a static
#     x86_64 OpenSSL (ARM Homebrew libs cannot be used while cross-compiling).
#     Steps are inline so workflow_dispatch on an older tag still works.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to build and attach
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  packages: write

concurrency:
  group: release-assets-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_RELEASE_LTO: thin
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 8
  CARGO_PROFILE_RELEASE_STRIP: symbols

jobs:
  build-assets:
    name: Build Asset (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            bin: amber
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            bin: amber
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            bin: amber
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
            bin: amber
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            bin: amber.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
          cache-targets: false
          cache-on-failure: true

      - name: Install lld (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lld

      - name: Install OpenSSL (Windows, vcpkg)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:VCPKG_INSTALLATION_ROOT) {
            throw "VCPKG_INSTALLATION_ROOT is not set on this runner"
          }
          vcpkg install openssl:x64-windows-static-md
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      - name: Configure OpenSSL env (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows_openssl_env.ps1

      # Checkout is the release tag, so this must stay inline (not a new repo script).
      - name: Install OpenSSL (macOS)
        if: runner.os == 'macOS'
        run: brew install openssl@3 pkg-config

      - name: Cache x86_64 OpenSSL (cross)
        if: matrix.target == 'x86_64-apple-darwin'
        uses: actions/cache@v4
        with:
          path: ~/openssl-x86_64-3.5.8
          key: openssl-3.5.8-darwin64-x86_64-static

      - name: Configure OpenSSL env (macOS)
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [ -z "${MACOSX_DEPLOYMENT_TARGET:-}" ]; then
            echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"
            export MACOSX_DEPLOYMENT_TARGET=11.0
          fi

          write_openssl_env() {
            local prefix="$1"
            local cross_x86="$2"
            if [ ! -f "${prefix}/include/openssl/ssl.h" ]; then
              echo "::error::OpenSSL headers missing under ${prefix}"
              exit 1
            fi
            local libdir=""
            if [ -f "${prefix}/lib/libssl.a" ] || [ -f "${prefix}/lib/libssl.dylib" ]; then
              libdir="${prefix}/lib"
            elif [ -f "${prefix}/lib64/libssl.a" ]; then
              libdir="${prefix}/lib64"
            else
              echo "::error::OpenSSL libraries missing under ${prefix}"
              exit 1
            fi
            {
              echo "OPENSSL_DIR=${prefix}"
              echo "OPENSSL_LIB_DIR=${libdir}"
              echo "OPENSSL_INCLUDE_DIR=${prefix}/include"
              echo "PKG_CONFIG_PATH=${libdir}/pkgconfig"
            } >> "$GITHUB_ENV"
            if [ "${cross_x86}" = "1" ]; then
              {
                echo "OPENSSL_STATIC=1"
                echo "PKG_CONFIG_ALLOW_CROSS=1"
                echo "X86_64_APPLE_DARWIN_OPENSSL_DIR=${prefix}"
                echo "X86_64_APPLE_DARWIN_OPENSSL_LIB_DIR=${libdir}"
                echo "X86_64_APPLE_DARWIN_OPENSSL_INCLUDE_DIR=${prefix}/include"
              } >> "$GITHUB_ENV"
            fi
            echo "Using OpenSSL at ${prefix} (lib=${libdir})"
          }

          if [ "${TARGET}" = "x86_64-apple-darwin" ]; then
            OPENSSL_VERSION="3.5.8"
            OPENSSL_SHA256="a8f84a39918ec6415ce765d9b429d313ba97b8143169c172e734b9514464f5b2"
            PREFIX="${HOME}/openssl-x86_64-${OPENSSL_VERSION}"
            if [ ! -f "${PREFIX}/lib/libssl.a" ]; then
              work="$(mktemp -d)"
              tarball="${work}/openssl-${OPENSSL_VERSION}.tar.gz"
              url="https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz"
              echo "Downloading ${url}"
              curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "${url}" -o "${tarball}"
              actual="$(shasum -a 256 "${tarball}" | awk '{print $1}')"
              if [ "${actual}" != "${OPENSSL_SHA256}" ]; then
                echo "::error::OpenSSL tarball SHA-256 mismatch (got ${actual})"
                exit 1
              fi
              tar -xzf "${tarball}" -C "${work}"
              (
                cd "${work}/openssl-${OPENSSL_VERSION}"
                ./Configure darwin64-x86_64-cc \
                  --prefix="${PREFIX}" \
                  --openssldir="${PREFIX}/ssl" \
                  no-shared \
                  no-tests
                make -j"$(sysctl -n hw.ncpu)"
                make install_sw
              )
            fi
            arch_ok=0
            if lipo -info "${PREFIX}/lib/libssl.a" 2>/dev/null | tee /dev/stderr | grep -q x86_64; then
              arch_ok=1
            elif otool -hv "${PREFIX}/lib/libssl.a" | tee /dev/stderr | grep -q X86_64; then
              arch_ok=1
            fi
            if [ "${arch_ok}" -ne 1 ]; then
              echo "::error::expected x86_64 libssl.a, refusing ARM Homebrew OpenSSL"
              exit 1
            fi
            write_openssl_env "${PREFIX}" 1
          else
            PREFIX="$(brew --prefix openssl@3)"
            write_openssl_env "${PREFIX}" 0
          fi

      - name: Build release binary
        env:
          RUSTFLAGS: ${{ runner.os == 'Linux' && '-C link-arg=-fuse-ld=lld' || '' }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Create release archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
          BIN: ${{ matrix.bin }}
        run: |
          mkdir -p staging
          src="target/${TARGET}/release/${BIN}"
          # Prefix must stay amber-. v1.16.0 and earlier shipped bee- leftovers;
          # install.sh / install.ps1 fall back to that name for old tags.
          if [ "${ARCHIVE}" = "zip" ]; then
            cp "${src}" staging/amber.exe
            python3 -c "import shutil; shutil.make_archive('amber-${RELEASE_TAG}-${TARGET}', 'zip', 'staging')"
          else
            cp "${src}" staging/amber
            tar -czf "amber-${RELEASE_TAG}-${TARGET}.tar.gz" -C staging amber
          fi

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: amber-${{ matrix.target }}
          path: amber-${{ env.RELEASE_TAG }}-${{ matrix.target }}.${{ matrix.archive }}
          compression-level: 0
          if-no-files-found: error

  publish-release:
    name: GitHub Release
    if: ${{ always() && !cancelled() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build-assets
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: false

      - name: Require Unix archives and Windows zip
        run: |
          set -euo pipefail
          require_one() {
            local pattern="$1"
            local label="$2"
            local count
            count=$(find release -type f -name "${pattern}" | wc -l | tr -d ' ')
            echo "${label}=${count}"
            if [ "${count}" -lt 1 ]; then
              echo "::error::${label} ${pattern} was not produced; Homebrew and install.sh need the five-asset set"
              exit 1
            fi
          }
          require_one 'amber-*-x86_64-unknown-linux-gnu.tar.gz' linux_x64_archive
          require_one 'amber-*-aarch64-unknown-linux-gnu.tar.gz' linux_arm64_archive
          require_one 'amber-*-aarch64-apple-darwin.tar.gz' macos_arm64_archive
          require_one 'amber-*-x86_64-apple-darwin.tar.gz' macos_x64_archive
          require_one 'amber-*-x86_64-pc-windows-msvc.zip' windows_zip
          if ! find release -type f -name 'amber-*-x86_64-pc-windows-msvc.zip' -print0 | xargs -0 unzip -l | grep -q 'amber.exe'; then
            echo "::error::Windows zip does not contain amber.exe"
            exit 1
          fi

      - name: Generate formal release notes and checksums
        run: |
          python3 scripts/generate_release_notes.py \
            --tag "${RELEASE_TAG}" \
            --release-dir release \
            --output RELEASE_NOTES.md

      - name: Update Homebrew formula SHA256
        run: |
          python3 scripts/update_homebrew_formula.py \
            --formula Formula/amber.rb \
            --release-dir release \
            --version "${RELEASE_TAG}" \
            --write

      # path: is a directory (syft scan dir:...). Cargo.lock must use file:.
      # v1.16.1 failed with: local-directory: not a directory source: Cargo.lock
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0.24.2
        with:
          file: Cargo.lock
          format: cyclonedx-json
          artifact-name: amber-${{ env.RELEASE_TAG }}.cdx.json
          output-file: amber-${{ env.RELEASE_TAG }}.cdx.json
          upload-artifact: false
          upload-release-assets: false
          syft-version: v1.42.3

      - name: Verify CycloneDX SBOM
        run: |
          set -euo pipefail
          f="amber-${RELEASE_TAG}.cdx.json"
          if [ ! -s "$f" ]; then
            echo "::error::SBOM ${f} was not produced"
            exit 1
          fi
          python3 - "$f" <<'PY'
          import json, sys
          path = sys.argv[1]
          with open(path, encoding="utf-8") as fh:
              data = json.load(fh)
          bom = data.get("bomFormat") or data.get("bomformat")
          if bom != "CycloneDX":
              raise SystemExit(f"{path} is not CycloneDX JSON (bomFormat={bom!r})")
          components = data.get("components") or []
          if not components:
              raise SystemExit(f"{path} has no components")
          spec = data.get("specVersion")
          print(f"{path}: CycloneDX spec={spec} components={len(components)}")
          PY

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign release blobs
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          mapfile -t blobs < <(find release -type f \( -name 'amber-*.tar.gz' -o -name 'amber-*.zip' -o -name 'checksums.txt' \) ; ls -1 amber-*.cdx.json 2>/dev/null || true)
          for f in "${blobs[@]}"; do
            [ -f "$f" ] || continue
            cosign sign-blob --yes --output-signature "${f}.sig" --output-certificate "${f}.pem" "$f"
          done

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Release ${{ env.RELEASE_TAG }}
          body_path: RELEASE_NOTES.md
          files: |
            release/**/amber-*.tar.gz
            release/**/amber-*.zip
            release/checksums.txt
            amber-*.cdx.json
            **/*.sig
            **/*.pem
          draft: false
          prerelease: false

      # Direct push to main may be blocked by the required-status-checks ruleset.
      # Do not fail the GitHub Release if that happens; hashes are already in Formula/amber.rb.
      - name: Commit Homebrew formula
        continue-on-error: true
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          default_branch="${{ github.event.repository.default_branch }}"
          default_branch="${default_branch:-main}"
          git fetch origin "${default_branch}"
          formula_copy="$(mktemp)"
          cp Formula/amber.rb "${formula_copy}"
          git checkout -B "homebrew-${RELEASE_TAG}" "origin/${default_branch}"
          cp "${formula_copy}" Formula/amber.rb
          git add Formula/amber.rb
          if git diff --cached --quiet; then
            echo "Formula/amber.rb unchanged"
          else
            git commit -m "chore(release): update Formula/amber.rb hashes for ${RELEASE_TAG}"
            git push origin "HEAD:${default_branch}"
          fi

      - name: Annotate skipped crates.io publish
        if: env.CARGO_REGISTRY_TOKEN == ''
        run: |
          echo "::warning::CARGO_REGISTRY_TOKEN is not set; skipping crates.io publish for ${RELEASE_TAG}"

      - name: Install Rust
        if: env.CARGO_REGISTRY_TOKEN != ''
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Cache cargo registry
        if: env.CARGO_REGISTRY_TOKEN != ''
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: crates-io-publish
          cache-targets: false
          cache-on-failure: true

      # Members first (path+version deps), then root. Re-runs on workflow_dispatch
      # treat "already uploaded" as success. A publish failure after GitHub
      # Release is intentional so the missing crates.io crate is visible.
      - name: Publish to crates.io
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: |
          set -euo pipefail
          publish_one() {
            local pkg="$1"
            local attempt
            for attempt in 1 2 3 4 5; do
              local log
              log="$(mktemp)"
              set +e
              cargo publish -p "$pkg" --locked --token "$CARGO_REGISTRY_TOKEN" 2>&1 | tee "$log"
              local status="${PIPESTATUS[0]}"
              set -e
              if [ "$status" -eq 0 ]; then
                return 0
              fi
              if grep -qiE 'already exists|already uploaded' "$log"; then
                echo "skip $pkg (already on crates.io)"
                return 0
              fi
              if grep -qiE 'no matching package named|not found in the registry|try again later|timed out|timeout|503|502|429' "$log"; then
                echo "retry $pkg after index/network delay (attempt ${attempt})"
                sleep $((attempt * 15))
                continue
              fi
              echo "::error::cargo publish -p $pkg failed"
              return 1
            done
            echo "::error::cargo publish -p $pkg failed after retries"
            return 1
          }
          publish_one amber_transpile
          publish_one amber_sandbox
          publish_one amberjs

name: Release Assets

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to build and attach
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  packages: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build-assets:
    name: Build Asset (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            bin: bee
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            bin: bee
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            bin: bee
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
            bin: bee
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            bin: bee.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-
            ${{ runner.os }}-cargo-

      - name: Install OpenSSL (Windows)
        if: runner.os == 'Windows'
        run: choco install openssl --no-progress -y

      - name: Configure OpenSSL env (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows_openssl_env.ps1

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Create release archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
          BIN: ${{ matrix.bin }}
        run: |
          mkdir -p staging
          src="target/${TARGET}/release/${BIN}"
          if [ "${ARCHIVE}" = "zip" ]; then
            cp "${src}" staging/bee.exe
            python3 -c "import shutil; shutil.make_archive('bee-${RELEASE_TAG}-${TARGET}', 'zip', 'staging')"
          else
            cp "${src}" staging/bee
            tar -czf "bee-${RELEASE_TAG}-${TARGET}.tar.gz" -C staging bee
          fi

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: bee-${{ matrix.target }}
          path: bee-${{ env.RELEASE_TAG }}-${{ matrix.target }}.${{ matrix.archive }}

  publish-release:
    name: GitHub Release
    if: ${{ always() && !cancelled() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    needs: build-assets
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: false

      - name: Require Unix archives and Windows zip
        run: |
          set -euo pipefail
          count=$(find release -type f -name 'bee-*.tar.gz' | wc -l | tr -d ' ')
          echo "unix_archives=${count}"
          if [ "${count}" -lt 1 ]; then
            echo "::error::No Unix archives were produced; refusing empty GitHub Release"
            exit 1
          fi
          zipcount=$(find release -type f -name 'bee-*-x86_64-pc-windows-msvc.zip' | wc -l | tr -d ' ')
          echo "windows_zips=${zipcount}"
          if [ "${zipcount}" -lt 1 ]; then
            echo "::error::Windows zip bee-*-x86_64-pc-windows-msvc.zip was not produced"
            exit 1
          fi
          if ! find release -type f -name 'bee-*-x86_64-pc-windows-msvc.zip' -print0 | xargs -0 unzip -l | grep -q 'bee.exe'; then
            echo "::error::Windows zip does not contain bee.exe"
            exit 1
          fi

      - name: Generate formal release notes and checksums
        run: |
          python3 scripts/generate_release_notes.py \
            --tag "${RELEASE_TAG}" \
            --release-dir release \
            --output RELEASE_NOTES.md

      - name: Update Homebrew formula SHA256
        run: |
          python3 scripts/update_homebrew_formula.py \
            --formula Formula/bee.rb \
            --release-dir release \
            --version "${RELEASE_TAG}" \
            --write

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: bee-${{ env.RELEASE_TAG }}.cdx.json
          output-file: bee-${{ env.RELEASE_TAG }}.cdx.json
          upload-artifact: false

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign release blobs
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          mapfile -t blobs < <(find release -type f \( -name 'bee-*.tar.gz' -o -name 'bee-*.zip' -o -name 'checksums.txt' \) ; ls -1 bee-*.cdx.json 2>/dev/null || true)
          for f in "${blobs[@]}"; do
            [ -f "$f" ] || continue
            cosign sign-blob --yes --output-signature "${f}.sig" --output-certificate "${f}.pem" "$f"
          done

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Release ${{ env.RELEASE_TAG }}
          body_path: RELEASE_NOTES.md
          files: |
            release/**/bee-*.tar.gz
            release/**/bee-*.zip
            release/checksums.txt
            bee-*.cdx.json
            **/*.sig
            **/*.pem
          draft: false
          prerelease: false

      # Direct push to main may be blocked by the required-status-checks ruleset.
      # Do not fail the GitHub Release if that happens; hashes are already in Formula/bee.rb.
      - name: Commit Homebrew formula
        continue-on-error: true
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          default_branch="${{ github.event.repository.default_branch }}"
          default_branch="${default_branch:-main}"
          git fetch origin "${default_branch}"
          formula_copy="$(mktemp)"
          cp Formula/bee.rb "${formula_copy}"
          git checkout -B "homebrew-${RELEASE_TAG}" "origin/${default_branch}"
          cp "${formula_copy}" Formula/bee.rb
          git add Formula/bee.rb
          if git diff --cached --quiet; then
            echo "Formula/bee.rb unchanged"
          else
            git commit -m "chore(release): update Formula/bee.rb hashes for ${RELEASE_TAG}"
            git push origin "HEAD:${default_branch}"
          fi

      - name: Annotate skipped crates.io publish
        if: env.CARGO_REGISTRY_TOKEN == ''
        run: |
          echo "::warning::CARGO_REGISTRY_TOKEN is not set; skipping crates.io publish for ${RELEASE_TAG}"

      - name: Install Rust
        if: env.CARGO_REGISTRY_TOKEN != ''
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Publish to crates.io
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: cargo publish --locked --token "$CARGO_REGISTRY_TOKEN"

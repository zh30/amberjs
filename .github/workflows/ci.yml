name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1

jobs:
  checks:
    name: Format, Lint, Test, Package
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --verbose

      - name: Feature matrix (compile-only)
        run: |
          set -e
          for feat in benchmarks observability; do
            echo "::group::cargo check --features $feat"
            cargo check --features "$feat"
            echo "::endgroup::"
          done

      - name: WinterTC compliance tests
        run: cargo test --test wintertc_compliance_tests -- --test-threads=1

      - name: Node conformance scorecard
        run: |
          cargo build -q
          ./tests/conformance/run_conformance.sh
          echo "Scorecard:"
          cat tests/conformance/scorecard.md

      - name: bee test directory mode
        run: |
          cargo build -q
          ./target/debug/bee test examples/testing

      - name: Check crate package contents
        run: cargo package --locked --list

  release-build:
    name: Release Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-
            ${{ runner.os }}-cargo-

      - name: Build release binary
        run: cargo build --release --verbose

      - name: Smoke test release binary
        run: |
          ./target/release/bee --version
          ./target/release/bee eval "1 + 1"

      - name: Library tests on macOS
        if: runner.os == 'macOS'
        run: cargo test --lib --tests -- --test-threads=1

  windows-smoke:
    name: Windows Smoke
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-windows-smoke-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-windows-smoke-
            ${{ runner.os }}-cargo-

      - name: Install OpenSSL
        run: choco install openssl --no-progress -y

      - name: Configure OpenSSL env
        shell: pwsh
        run: ./scripts/windows_openssl_env.ps1

      - name: Build release binary
        run: cargo build --release

      - name: Smoke test
        shell: pwsh
        run: |
          .\target\release\bee.exe --version
          .\target\release\bee.exe eval "1 + 1"

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo-audit
        run: cargo audit

      - name: cargo-deny licenses
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

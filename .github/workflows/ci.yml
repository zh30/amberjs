name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1

jobs:
  checks:
    name: Format, Lint, Test, Package
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --verbose

      - name: Feature matrix (compile-only)
        run: |
          set -e
          for feat in benchmarks observability; do
            echo "::group::cargo check --features $feat"
            cargo check --features "$feat"
            echo "::endgroup::"
          done

      - name: WinterTC compliance tests
        run: cargo test --test wintertc_compliance_tests -- --test-threads=1

      - name: amber compile Stable contract
        run: cargo test --test compile_contract_tests -- --test-threads=1

      - name: Install Node conformance framework deps
        run: |
          # express_smoke / fastify_smoke / hono_smoke look for these packages
          # under benchmarks/idle_memory/node_modules and print CONFORMANCE_SKIP
          # when they are missing. node_modules is gitignored, so a clean CI
          # checkout skips them and the 55/55 gate fails. Versions match
          # benchmarks/idle_memory/package.json. --no-save avoids rewriting it.
          npm install --prefix benchmarks/idle_memory --no-save --no-audit --no-fund --ignore-scripts \
            express@5.2.1 fastify@5.12.3 hono@4.13.5 @hono/node-server@2.1.1

      - name: Node conformance scorecard
        run: |
          cargo build -q
          # Fail-closed (#104): run_conformance.sh exits non-zero unless
          # PASS >= 55, FAIL == 0, and SKIP == 0. This job is a required
          # status check on main ("Format, Lint, Test, Package").
          ./tests/conformance/run_conformance.sh
          echo "Scorecard:"
          cat tests/conformance/scorecard.md

      - name: amber test directory mode
        run: |
          cargo build -q
          ./target/debug/amber test examples/testing

      - name: amber bundle Stable contract
        run: cargo test --test bundle_contract_tests -- --test-threads=1

      - name: amber install Stable contract
        run: cargo test --test install_contract_tests -- --test-threads=1

      - name: amber run --export-tools Stable contract
        run: cargo test --test export_tools_contract_tests -- --test-threads=1

      - name: amber watch Stable contract
        run: cargo test --test watch_contract_tests -- --test-threads=1

      - name: amber serve --https Stable contract
        run: cargo test --test serve_https_contract_tests -- --test-threads=1

      - name: node fs Stable contract
        run: cargo test --test fs_contract_tests -- --test-threads=1

      - name: node path Stable contract
        run: cargo test --test path_contract_tests -- --test-threads=1

      - name: node events Stable contract
        run: cargo test --test node_events_contract_tests -- --test-threads=1

      - name: node buffer Stable contract
        run: cargo test --test buffer_contract_tests -- --test-threads=1

      - name: node os Stable contract
        run: cargo test --test os_contract_tests -- --test-threads=1

      - name: node zlib Stable contract
        run: cargo test --test zlib_contract_tests -- --test-threads=1

      - name: node util Stable contract
        run: cargo test --test util_contract_tests -- --test-threads=1

      - name: node process Stable contract
        run: cargo test --test process_contract_tests -- --test-threads=1

      - name: node crypto Stable contract
        run: cargo test --test node_crypto_contract_tests -- --test-threads=1

      - name: node stream Stable contract
        run: cargo test --test node_stream_contract_tests -- --test-threads=1

      - name: node child_process Stable contract
        run: cargo test --test child_process_contract_tests -- --test-threads=1

      - name: node url Stable contract
        run: cargo test --test node_url_contract_tests -- --test-threads=1

      - name: node dns Stable contract
        run: cargo test --test dns_contract_tests -- --test-threads=1

      - name: node require Stable contract
        run: cargo test --test require_contract_tests -- --test-threads=1

      - name: node http server Stable contract
        run: cargo test --test http_server_contract_tests -- --test-threads=1

      - name: node querystring Stable contract
        run: cargo test --test querystring_contract_tests -- --test-threads=1

      - name: web fetch Stable contract
        run: cargo test --test fetch_contract_tests -- --test-threads=1

      - name: web streams timers Stable contract
        run: cargo test --test streams_timers_contract_tests -- --test-threads=1

      - name: web blob formdata Stable contract
        run: cargo test --test blob_formdata_contract_tests -- --test-threads=1

      - name: web url encoding Stable contract
        run: cargo test --test url_encoding_contract_tests -- --test-threads=1

      - name: web events channels Stable contract
        run: cargo test --test events_channels_contract_tests -- --test-threads=1

      - name: web crypto Stable contract
        run: cargo test --test web_crypto_contract_tests -- --test-threads=1

      - name: web workers Stable contract
        run: cargo test --test workers_contract_tests -- --test-threads=1

      - name: web websocket Stable contract
        run: cargo test --test websocket_contract_tests -- --test-threads=1

      - name: web atob btoa Stable contract
        run: cargo test --test atob_btoa_contract_tests -- --test-threads=1

      - name: web error event Stable contract
        run: cargo test --test error_event_contract_tests -- --test-threads=1

      - name: web clipboard Stable contract
        run: cargo test --test clipboard_api_tests -- --test-threads=1

      - name: web DOMParser Stable contract
        run: cargo test --test dom_parser_tests -- --test-threads=1

      - name: web background sync Stable contract
        run: cargo test --test background_sync_tests -- --test-threads=1

      - name: web cache Stable contract
        run: cargo test --test cache_storage_tests -- --test-threads=1

      - name: web SW fetch Stable contract
        run: cargo test --test service_worker_fetch_intercept_tests -- --test-threads=1

      - name: TypeScript Stable contract
        run: cargo test --test typescript_contract_tests -- --test-threads=1

      - name: Check crate package contents
        run: cargo package --locked --list

  release-build:
    name: Release Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-
            ${{ runner.os }}-cargo-

      - name: Build release binary
        run: cargo build --release --verbose

      - name: Smoke test release binary
        run: |
          ./target/release/amber --version
          ./target/release/amber eval "1 + 1"

      - name: SEA compile smoke
        run: bash scripts/sea_compile_smoke.sh ./target/release/amber

      - name: Library tests on macOS
        if: runner.os == 'macOS'
        run: cargo test --lib --tests -- --test-threads=1

  windows-smoke:
    name: Windows Smoke
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-windows-smoke-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-windows-smoke-
            ${{ runner.os }}-cargo-

      - name: Install OpenSSL
        run: choco install openssl --no-progress -y

      - name: Configure OpenSSL env
        shell: pwsh
        run: ./scripts/windows_openssl_env.ps1

      - name: Build release binary
        run: cargo build --release

      - name: Smoke test
        shell: pwsh
        run: |
          .\target\release\amber.exe --version
          .\target\release\amber.exe eval "1 + 1"

      - name: SEA compile smoke
        shell: pwsh
        run: ./scripts/sea_compile_smoke.ps1 -Amber .\target\release\amber.exe

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo-audit
        run: cargo audit

      - name: cargo-deny licenses
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

name: test262

on:
  push:
    branches: [main]
    paths:
      - "tests/test262/**"
      - "scripts/fetch_test262.sh"
      - "src/runtime_minimal.rs"
      - "src/main.rs"
      - "src/typescript/**"
      - "src/test262_host.rs"
      - ".github/workflows/test262.yml"
  pull_request:
    branches: [main]
    paths:
      - "tests/test262/**"
      - "scripts/fetch_test262.sh"
      - "src/runtime_minimal.rs"
      - "src/main.rs"
      - "src/typescript/**"
      - "src/test262_host.rs"
      - ".github/workflows/test262.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test262-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: test262 smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Install OpenSSL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libssl-dev pkg-config

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-test262-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-test262-
            ${{ runner.os }}-cargo-

      - name: Harness self-test
        run: python3 tests/test262/run_test262.py --self-test

      - name: Fetch test262 pin
        run: ./scripts/fetch_test262.sh

      - name: Build amber
        run: cargo build -q

      - name: Smoke paths (fail-closed)
        env:
          AMBER_BIN: ./target/debug/amber
          AMBER_TEST262: "1"
        run: |
          # Fail-closed smoke. language/types is currently all-green (211/211) and
          # is the gate; expand to full suite only when that path stays green.
          set -e
          ./target/debug/amber --version
          # jobs=1: CI saw amber SIGBUS (exit -7) on S8.3_A1_T2 under --jobs 4.
          # Gate must stay deterministic 211/0/0; runner also retries signal deaths.
          for path in language/types/boolean language/types/null language/types/number \
                      language/types/object language/types/string language/types/undefined \
                      language/types; do
            echo "::group::test262 --path $path"
            python3 tests/test262/run_test262.py --path "$path" --jobs 1
            echo "::endgroup::"
          done
          echo "Scorecard (language/types):"
          cat tests/test262/scorecard.md


      - name: Upload scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test262-scorecard
          path: |
            tests/test262/scorecard.md
            tests/test262/scorecard.json

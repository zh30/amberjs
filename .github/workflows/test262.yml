name: test262

on:
  push:
    branches: [main]
    paths:
      - "tests/test262/**"
      - "scripts/fetch_test262.sh"
      - "src/runtime_minimal.rs"
      - "src/main.rs"
      - ".github/workflows/test262.yml"
  pull_request:
    branches: [main]
    paths:
      - "tests/test262/**"
      - "scripts/fetch_test262.sh"
      - "src/runtime_minimal.rs"
      - "src/main.rs"
      - ".github/workflows/test262.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test262-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: test262 smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Install OpenSSL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libssl-dev pkg-config

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-test262-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-test262-
            ${{ runner.os }}-cargo-

      - name: Harness self-test
        run: python3 tests/test262/run_test262.py --self-test

      - name: Fetch test262 pin
        run: ./scripts/fetch_test262.sh

      - name: Build amber
        run: cargo build -q

      - name: Smoke paths (fail-closed green subsets)
        run: |
          # Fail-closed on known-green subsets while the full suite is driven to 0 FAIL.
          # Broader paths (e.g. language/types/reference) still have Amber host/runtime gaps.
          set -e
          AMBER_BIN=./target/debug/amber
          for path in language/types/boolean language/types/null language/types/number \
                      language/types/object language/types/string language/types/undefined; do
            echo "::group::test262 --path $path"
            "$AMBER_BIN" --version
            python3 tests/test262/run_test262.py --path "$path" --jobs 4
            echo "::endgroup::"
          done
          # Record a wider baseline slice (may FAIL; uploaded as artifact, not gate).
          python3 tests/test262/run_test262.py --path language/types --jobs 4 || true
          echo "Scorecard (language/types baseline):"
          cat tests/test262/scorecard.md

      - name: Upload scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test262-scorecard
          path: |
            tests/test262/scorecard.md
            tests/test262/scorecard.json

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>六个首屏</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@600;700&family=Noto+Sans+SC:wght@600;700&display=swap">
<style>
  body { margin: 0; background: #E7E5E4; color: #14120B; font-family: Geist, "Noto Sans SC", sans-serif; }
  h1 { font-size: 20px; line-height: 28px; margin: 24px; }
  .grid { display: grid; grid-template-columns: repeat(3, 480px); gap: 24px; padding: 0 24px 24px; }
  figure { margin: 0; }
  .frame { width: 480px; height: 300px; overflow: hidden; background: #F5F5F4; border: 1px solid #14120B; }
  iframe { width: 1440px; height: 900px; border: 0; transform: scale(0.3333); transform-origin: top left; }
  figcaption { font-size: 14px; line-height: 20px; margin-top: 8px; }
  .alt { width: 480px; height: 300px; border: 1px solid #14120B; position: relative; overflow: hidden; }
  .p1 { background: #F0C000; width: 300px; height: 120px; position: absolute; left: 24px; top: 36px; padding: 16px; font-weight: 700; font-size: 28px; line-height: 32px; }
  .p2 { background: #14120B; color: #F5F5F4; width: 280px; height: 88px; position: absolute; left: 160px; top: 120px; padding: 16px; font-family: ui-monospace, monospace; font-size: 13px; }
  .note { background: #F0C000; width: 220px; height: 140px; position: absolute; right: 36px; top: 28px; transform: rotate(4deg); padding: 16px; font-weight: 700; font-size: 28px; line-height: 32px; }
  .gem { position: absolute; left: 36px; bottom: 36px; width: 88px; height: 88px; }
  .blk { position: absolute; left: 140px; bottom: 48px; background: #14120B; color: #F0C000; padding: 12px 16px; font-weight: 700; }
  .plateA { position: absolute; left: 28px; top: 24px; bottom: 24px; width: 72px; background: #F0C000; border: 4px solid #F5F5F4; writing-mode: vertical-rl; font-weight: 700; font-size: 28px; display: flex; align-items: center; justify-content: center; }
  .plateB { position: absolute; left: 120px; right: 24px; top: 48px; height: 88px; background: #14120B; color: #F0C000; border: 4px solid #F5F5F4; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 28px; }
  .cream { background: #F5F5F4; }
  .night { background: #18181B; }
</style>
</head>
<body>
<h1>六个首屏。前三张是完整版，后三张是备选。</h1>
<div class="grid">
  <figure><div class="frame"><iframe src="dir-1.html" title="对切"></iframe></div><figcaption>1 对切 · 入选 · 字和命令各占一半</figcaption></figure>
  <figure><div class="frame"><iframe src="dir-2.html" title="代码台"></iframe></div><figcaption>2 代码台 · 入选 · 文件在上，命令在下</figcaption></figure>
  <figure><div class="frame"><iframe src="dir-3.html" title="对页"></iframe></div><figcaption>3 对页 · 入选 · 命令是通栏尺</figcaption></figure>
  <figure><div class="alt cream"><div class="p1">一个二进制</div><div class="p2">curl -fsSL<br>get.amberjs.com/install.sh</div></div><figcaption>4 叠板 · 备选 · 还是一叠牌子</figcaption></figure>
  <figure><div class="alt cream"><img class="gem" src="assets/logo.svg" alt=""><div class="note">一个二进制</div><div class="blk">v1.17.0</div></div><figcaption>5 便签 · 备选 · 斜贴撑不起整站</figcaption></figure>
  <figure><div class="alt night"><div class="plateA">琥珀</div><div class="plateB">一个二进制</div></div><figcaption>6 街招 · 备选 · 霓虹和繁体不做</figcaption></figure>
</div>
</body>
</html>

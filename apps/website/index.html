  <script>
    (function() {
      try {
        var stored = localStorage.getItem('amber-theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var isDark = stored === 'dark' || (stored === 'system' && prefersDark);
        if (isDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
        }
        // Language resolution: 1. User manual override, 2. Browser detection, 3. Fallback to English
        var SUPPORTED_LANGS = ['en', 'zh', 'hi', 'es', 'fr'];
        var storedLang = localStorage.getItem('amber_lang');
        var resolvedLang = null;
        if (storedLang && SUPPORTED_LANGS.indexOf(storedLang) !== -1) {
          resolvedLang = storedLang;
        } else {
          var navLangs = navigator.languages || [navigator.language || ''];
          for (var i = 0; i < navLangs.length; i++) {
            var prefix = (navLangs[i] || '').toLowerCase().split('-')[0];
            if (SUPPORTED_LANGS.indexOf(prefix) !== -1) {
              resolvedLang = prefix;
              break;
            }
          }
        }
        resolvedLang = resolvedLang || 'en';
        document.documentElement.lang = resolvedLang;
        window.__AMBER_INITIAL_LANG__ = resolvedLang;
      } catch (e) {}
    })();
  </script>
